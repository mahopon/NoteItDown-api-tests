info:
  name: Create Note
  type: http
  seq: 2

http:
  method: POST
  url: "{{BACKEND_URL}}/notes"
  headers:
    - name: X-CSRF-TOKEN
      value: "{{X-CSRF-TOKEN}}"
  body:
    type: json
    data: |-
      {
        "title": "Example"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
